name: Release

# Tag a commit to ship it:
#   git tag v0.2.0 && git push origin v0.2.0
#
# The job publishes, packs a Velopack installer and attaches it to a GitHub Release. The running app
# reads that release feed, so the update path and the download link are the same artefacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # v4 of both actions declares `using: node20` in its own action.yml, and the runner has been
      # forcing those onto Node 24 and warning about it on every release. v5 upwards declares node24
      # and the warning goes. Nothing else in these majors reaches this workflow: checkout v6 moved
      # git credentials out of .git/config, which would matter if a later step shelled out to git,
      # and this one talks to GitHub through `gh` with GH_TOKEN; checkout v7 blocks checking out fork
      # PR heads on pull_request_target and workflow_run, and this runs on tag push.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "'$v' is not a version" }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "building $v"

      - name: Test
        run: dotnet test --configuration Release --logger "console;verbosity=minimal"

      # Velopack builds a delta against the previous release, but only if the previous packages are
      # sitting in the output folder. Without this every update is a full ~90 MB download.
      - name: Fetch the previous release for delta packaging
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path build/releases | Out-Null
          $current = 'v${{ steps.version.outputs.value }}'

          # Must match --packId in build/pack.ps1.
          $packId = 'TawkTypeApp'

          # Skip our own tag. On a re-run the release already exists, and downloading it puts a package
          # of the version being built into the folder vpk checks — which fails with "there is a release
          # equal or greater to the current version", naming a release the job itself fetched.
          $previous = gh release list --limit 2 --json tagName --jq '.[].tagName' |
            Where-Object { $_ -ne $current } | Select-Object -First 1

          if ($previous) {
            # Only the previous *full* package, which is all a delta needs to be built against.
            #
            # Downloading '*.nupkg' fetched every package the previous release carried, vpk then listed
            # all of them in the feed, and this job uploaded the lot again — so each release inherited
            # its predecessor's history and grew. v0.3.0 shipped 364 MB of assets, 17 packages, for an
            # application that is 37 MB. A user on any version can always take the newest full package,
            # so the older ones buy nothing.
            # The package id is in the pattern, not a wildcard. A delta can only be built against the
            # same application, and everything in this folder gets uploaded to the new release — so a
            # wildcard would attach the previous *identity's* package to it. That is not hypothetical:
            # the packId has changed twice, most recently to TawkTypeApp at v0.5.0.
            $previousVersion = $previous.TrimStart('v')
            Write-Host "previous release: $previous (fetching its full package for the delta)"
            gh release download $previous --dir build/releases --pattern "$packId-$previousVersion-full.nupkg" --clobber

            if (Get-ChildItem build/releases -Filter '*.nupkg' -EA SilentlyContinue) {
              Write-Host "got it; this release will carry a delta"
            } else {
              Write-Host "$previous predates the $packId package id, so this one is a full package only"
            }
          } else {
            Write-Host "no previous release; this one will be a full package only"
          }

      - name: Publish and pack
        shell: pwsh
        run: ./build/pack.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.value }}'

          # Checksums for everything that is about to be uploaded, written into the same folder so
          # the list goes up with the files it describes. Computed before the file is created, so it
          # never tries to hash itself.
          #
          # This is not a substitute for a signature and does not pretend to be: anyone who can
          # replace the download can replace the list beside it. It is here for the person who has
          # been sent a copy of the installer from somewhere else and wants to know whether it is the
          # one this release built.
          $hashes = [ordered]@{}
          foreach ($file in Get-ChildItem build/releases -File) {
            $hashes[$file.Name] = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          }

          $lines = $hashes.GetEnumerator() | ForEach-Object { '{0}  {1}' -f $_.Value, $_.Key }
          Set-Content -Path build/releases/SHA256SUMS.txt -Value $lines -Encoding ascii
          Write-Host "checksummed $($hashes.Count) files"

          # Single-quoted so the markdown below is taken literally. A double-quoted here-string would
          # read every backtick as an escape character, and the code blocks are full of them.
          $notes = @'
          Install TawkType by downloading **TawkTypeApp-win-Setup.exe** below and running it.

          Requires the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0); the
          installer offers to fetch it if it is missing. No speech model is included: the first run
          walks you through choosing one, downloading it, and dictating a sentence to prove it works.
          Installed copies update themselves from this feed.

          ## Windows will warn you, and here is why

          TawkType is not code-signed, so the first time you run the installer Windows SmartScreen
          shows **"Windows protected your PC"**. Choose **More info**, then **Run anyway**.

          The warning is about the absence of a certificate, not about anything found in the file.
          Certificates cost money every year and this is a free, open-source project, so until that
          changes Windows has no name to attach the download to.

          If Windows later says the setup file is **open in System** when you try to move or delete
          it, that is Microsoft Defender still scanning it. It does not stop the installer running,
          and nothing is wrong. Wait a minute and try again, or leave the file where it is.

          ## Checking your download

          Every file in this release is listed in **SHA256SUMS.txt** with its SHA-256 hash. To check
          the installer, run this in PowerShell in the folder you downloaded it to:

          ```powershell
          Get-FileHash .\TawkTypeApp-win-Setup.exe -Algorithm SHA256
          ```

          and compare what it prints with:

          ```
          {{SETUP_SHA256}}  TawkTypeApp-win-Setup.exe
          {{PORTABLE_SHA256}}  TawkTypeApp-win-Portable.zip
          ```
          '@

          # Literal Replace, not the -replace operator, which would read the braces as a regex.
          $notes = $notes.Replace('{{SETUP_SHA256}}', $hashes['TawkTypeApp-win-Setup.exe'])
          $notes = $notes.Replace('{{PORTABLE_SHA256}}', $hashes['TawkTypeApp-win-Portable.zip'])

          gh release create $tag (Get-ChildItem build/releases | ForEach-Object FullName) `
            --title $tag --notes $notes --verify-tag
